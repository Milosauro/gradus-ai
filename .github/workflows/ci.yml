name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  validate-walden:
    name: Validate Walden Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.24'

      - name: Install Walden CLI
        run: |
          go install github.com/andrearaponi/walden/cmd/walden@v0.14.0

      - name: Validate Walden Specifications
        run: |
          walden validate --all --json

  test-go:
    name: Test & Lint Go (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Go Module
        run: |
          go mod verify

      - name: Run Tests with Race Detector
        if: runner.os != 'windows'
        run: |
          go test -v -race -count=1 ./...

      - name: Run Tests (Windows)
        if: runner.os == 'windows'
        run: |
          go test -v -count=1 ./...

      - name: Go Vet
        run: |
          go vet ./...
