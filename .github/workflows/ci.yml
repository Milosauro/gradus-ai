name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  validate-walden:
    name: Validate Walden Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install Walden CLI
        run: |
          go install github.com/andrearaponi/walden/cmd/walden@v0.14.0

      - name: Validate Walden Specifications
        run: |
          set -euo pipefail
          if [ ! -d .walden/specs ] || [ -z "$(ls -A .walden/specs 2>/dev/null)" ]; then
            echo "No Walden feature specs yet; skipping spec validation."
            exit 0
          fi
          walden validate --all --json

  test-go:
    name: Test & Build Go (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go Module
        run: |
          go mod verify

      - name: Run Tests with Race Detector (POSIX)
        if: runner.os != 'Windows'
        run: |
          go test -v -race -count=1 ./...

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          go test -v -count=1 ./...

      - name: Go Vet
        run: |
          go vet ./...

      - name: Build Static Binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /dev/null ./cmd/gradusctl
        if: runner.os != 'Windows'

      - name: Build Static Binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o NUL ./cmd/gradusctl

  gradus-verify:
    name: Gradus Self-Governance (Verify & Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build gradusctl
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o ./gradusctl ./cmd/gradusctl

      - name: Verify Gradus Pyramid & Compiled Targets
        run: |
          ./gradusctl verify --json

      - name: Run Gradus Deterministic Checks
        run: |
          ./gradusctl check --json

      - name: Upload Gradus Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradus-evidence
          path: .gradus/ci-artifacts/
          if-no-files-found: ignore

  test-action-non-go:
    name: Smoke Test Composite Action (Non-Go Repo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout action repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gradus-action-src

      - name: Create non-Go consumer repository without go.mod
        run: |
          set -euo pipefail
          mkdir -p consumer-python/.gradus/levels/project/rules
          cat << 'EOF' > consumer-python/app.py
          print("hello world")
          EOF
          cat << 'EOF' > consumer-python/.gradus/levels/project/level.yaml
          schema: gradus/v1
          id: project
          EOF
          cat << 'EOF' > consumer-python/.gradus/levels/project/rules/PY-001.md
          ---
          id: PY-001
          title: No eval in Python
          severity: MUST
          enforcement: check
          scope: ["**/*.py"]
          checker:
            name: regex
            pattern: '\beval\('
          ---
          Do not call eval().
          EOF
          cat << 'EOF' > consumer-python/gradus.yaml
          schema: gradus/v1
          levels:
            - id: project
              source: { path: .gradus/levels/project }
          targets: [agents-md]
          EOF
          cd consumer-python
          git init
          git config user.name "CI Test"
          git config user.email "ci@gradus.local"
          git add .
          git commit -m "init non-go repo"

      - name: Run Gradus Composite Action against non-Go repository
        uses: ./gradus-action-src/.github/actions/gradus
        with:
          version: 'v0.3.1'
          working-directory: consumer-python
          write-evidence: 'false'
          upload-evidence: 'false'
