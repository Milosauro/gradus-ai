name: CI

on:
  push:
    branches:
      - main
      - 'release/v*'
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  validate-walden:
    name: Validate Walden Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod

      - name: Install Walden CLI
        run: |
          go install github.com/andrearaponi/walden/cmd/walden@v0.14.0

      - name: Validate Walden Specifications
        run: |
          set -euo pipefail
          if [ ! -d .walden/specs ] || [ -z "$(ls -A .walden/specs 2>/dev/null)" ]; then
            echo "No Walden feature specs yet; skipping spec validation."
            exit 0
          fi
          walden validate --all --json

  test-go:
    name: Test & Build Go (Matrix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Go Module
        run: |
          go mod verify

      - name: Run Tests with Race Detector (POSIX)
        if: runner.os != 'Windows'
        run: |
          go test -v -race -count=1 ./...

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          go test -v -count=1 ./...

      - name: Go Vet
        run: |
          go vet ./...

      - name: Build Static Binary
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o /dev/null ./cmd/gradusctl
        if: runner.os != 'Windows'

      - name: Build Static Binary (Windows)
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o NUL ./cmd/gradusctl
