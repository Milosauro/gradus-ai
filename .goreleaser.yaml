version: 2

project_name: gradusctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gradusctl
    main: ./cmd/gradusctl
    binary: gradusctl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Milosauro/gradus-ai/internal/version.Version={{.Version}}
      - -X github.com/Milosauro/gradus-ai/internal/version.Commit={{.Commit}}
      - -X github.com/Milosauro/gradus-ai/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gradusctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.spdx.json"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    artifacts: checksum

release:
  github:
    owner: Milosauro
    name: gradus-ai
  draft: false
